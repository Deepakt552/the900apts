<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury Residence · Hero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonts & minimal custom overrides (only what Tailwind cannot do) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,400..600&display=swap');
    * { font-family: 'Inter', sans-serif; }
    /* custom colors & backdrop (tailwind lacks these exact values) */
    .bg-gold { background-color: #C79A5B; }
    .text-gold { color: #C79A5B; }
    .text-gold-light { color: #E2B878; }
    .border-gold { border-color: #C79A5B; }
    .bg-dark-secondary { background-color: #111827; }
    .hero-overlay { background: linear-gradient(135deg, rgba(9,17,29,0.82) 0%, rgba(9,17,29,0.40) 70%); }
    .glass-card { background: rgba(17,24,39,0.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 25px 40px -15px rgba(0,0,0,0.7); }
    .nav-blur { background: rgba(9,17,29,0.65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,215,140,0.15); }
    .trapezoid-logo { clip-path: polygon(0 0, 100% 0, 82% 100%, 0 100%); background: #fff; box-shadow: 0 20px 45px rgba(0,0,0,.25); }
    @media (max-width: 1023px) { .trapezoid-logo { clip-path: polygon(0% 0%, 95% 0%, 100% 100%, 0% 100%); padding-right: 1.2rem; } }
    .hero-bg { background-image: url('/images/hero.jpg'); background-size: cover; background-position: center center; }
    .building-img { background-image: url('/images/building.png'); background-size: 90% auto; background-repeat: no-repeat; background-position: bottom right; }
    .divider-gold { width: 56px; height: 3px; background: #C79A5B; border-radius: 4px; }
    .btn-primary { background-color: #C79A5B; color: white; box-shadow: 0 12px 30px -10px rgba(199,154,91,0.35); transition: all 0.2s ease; }
    .btn-primary:hover { background-color: #E2B878; transform: translateY(-2px); box-shadow: 0 18px 35px -10px rgba(199,154,91,0.5); }
    .btn-secondary { border: 1.5px solid rgba(255,255,255,0.5); color: white; background: transparent; transition: all 0.2s ease; }
    .btn-secondary:hover { background: rgba(255,255,255,0.08); border-color: #E2B878; transform: translateY(-2px); }
    .contact-divider { width: 1px; height: 40px; background: rgba(255,255,255,0.15); }
    .hover-scale-img { transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1); }
    .hover-scale-img:hover { transform: scale(1.02); }
    @media (max-width: 768px) { .contact-divider { display: none; } }
  </style>
</head>
<body class="">

  <div class="absolute top-0 left-0 z-[100]">
    <div class="trapezoid-logo h-[100px] w-[260px] flex items-center pl-10 shadow-2xl">
      <span class="text-3xl font-bold text-[#09111D]">The 900</span>
    </div>
  </div>

  <nav class="absolute top-0 left-0 w-full z-50 nav-blur h-[85px] flex items-center">
    <div class="max-w-8xl mx-auto w-full flex items-center justify-end px-6 lg:px-10">
      <div class="hidden lg:flex flex-1 justify-center space-x-8 text-sm uppercase tracking-wider font-semibold text-gray-300 ml-44"></div>
      <div class="flex items-center gap-3">
        <button class="hidden sm:inline-block btn-secondary text-sm font-medium px-5 py-2 rounded-md">Sign In</button>
        <button class="btn-primary text-sm font-medium px-5 py-2 rounded-md">Resident Portal</button>
        <button class="lg:hidden ml-2 text-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <section class="relative min-h-screen w-full hero-bg flex items-center overflow-hidden">
    <div class="absolute inset-0 hero-overlay z-10"></div>
    <div class="relative z-20 max-w-7xl mx-auto px-6 lg:px-10 w-full py-28 md:py-32 flex flex-col lg:flex-row items-center justify-between gap-12 lg:gap-8">

      <!-- Left content -->
      <div class="w-full lg:w-3/5 xl:w-[56%] flex flex-col items-start text-left">
        <span class="text-gold-light text-xs tracking-[0.25em] uppercase font-medium mb-2">Welcome Home To</span>
        <h1 class="text-4xl sm:text-6xl lg:text-7xl font-light leading-[1.05] tracking-tight mt-1">
          Essential<br />
          <span class="font-medium">Living</span>
        </h1>
        <div class="flex items-center gap-4 mt-1">
          <span class="text-gold italic text-2xl lg:text-3xl font-light">Expressed</span>
          <div class="divider-gold"></div>
        </div>
        <p class="text-gray-custom text-base sm:text-lg leading-relaxed max-w-md mt-5 font-light">
          Refined spaces. Modern amenities.<br />
          A lifestyle that speaks for itself.
        </p>
        <div class="flex flex-wrap items-center gap-4 mt-8">
          <button class="btn-primary px-8 py-3 rounded-md font-semibold text-sm tracking-wide shadow-xl">View Floor Plans</button>
          <button class="btn-secondary px-8 py-3 rounded-md font-semibold text-sm tracking-wide">Schedule a Tour</button>
        </div>

        <!-- Glass card contact -->
        <div class="glass-card w-full max-w-2xl rounded-2xl px-6 py-4 mt-12 flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-0">
          <div class="flex items-center gap-3 w-full sm:w-auto justify-center sm:justify-start">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
            </svg>
            <div>
              <div class="text-[10px] uppercase tracking-wider text-gray-400">Phone</div>
              <div class="text-sm font-medium text-white">+1 (800) 555‑LUXE</div>
            </div>
          </div>
          <div class="contact-divider"></div>
          <div class="flex items-center gap-3 w-full sm:w-auto justify-center sm:justify-start">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            <div>
              <div class="text-[10px] uppercase tracking-wider text-gray-400">Email</div>
              <div class="text-sm font-medium text-white">reside@luxe.com</div>
            </div>
          </div>
          <div class="contact-divider"></div>
          <div class="flex items-center gap-3 w-full sm:w-auto justify-center sm:justify-start">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <div>
              <div class="text-[10px] uppercase tracking-wider text-gray-400">Leasing Office</div>
              <div class="text-sm font-medium text-white">42 Park Ave, NYC</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right image (building) -->
      <div class="w-full lg:w-2/5 xl:w-[40%] flex justify-end items-end self-end lg:self-end relative mt-8 lg:mt-0">
        <div class="w-full max-w-[320px] lg:max-w-[380px] xl:max-w-[440px] ml-auto rounded-xl shadow-2xl overflow-hidden hover-scale-img building-img aspect-[4/5] bg-no-repeat bg-right-bottom" style="min-height: 320px; background-size: 90% auto; background-position: bottom right;">
        </div>
      </div>
    </div>

    <!-- bottom gradient -->
    <div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-[#09111D] to-transparent z-10 pointer-events-none"></div>
  </section>

</body>
</html>
