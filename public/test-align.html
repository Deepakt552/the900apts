<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 0;
    background: #1a73b5;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  /* The scene container anchored to the bottom */
  .scene-container {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    height: 100%;
    max-height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .scene-inner {
    position: relative;
    width: 100%;
    height: 100%;
    max-height: 100%;
    aspect-ratio: 1942 / 809;
    max-width: calc(100vh * (1942 / 809));
  }
  .bldg-layer {
    position: absolute;
    left: calc(2px / 1942 * 100%);
    top: calc(-2px / 809 * 100%);
    width: calc(1928px / 1942 * 100%);
    height: calc(816px / 809 * 100%);
    z-index: 10;
  }
  .bldg-layer img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
  }
  .bg-layer {
    position: absolute;
    left: calc(-1px / 1942 * 100%);
    top: calc(6px / 809 * 100%);
    width: calc(1959px / 1942 * 100%);
    height: calc(803px / 809 * 100%);
    z-index: 20;
  }
  .bg-layer img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="scene-container">
      <div class="scene-inner">
        <div class="bldg-layer">
          <img src="./Home/buidng01.webp" alt="Building">
        </div>
        <div class="bg-layer">
          <img src="./Home/bg01.webp" alt="Street Foreground">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
